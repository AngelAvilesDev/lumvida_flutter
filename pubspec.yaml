name: lumvida_app
description: Una aplicación para reportar problemas urbanos.

# La versión de tu aplicación
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase - versiones modernas para compatibilidad total
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.2
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0

  # Gestión de estado
  provider: ^6.1.1

  # Autenticación con Google
  google_sign_in: ^6.2.1

  # UI
  cupertino_icons: ^1.0.5
  flutter_svg: ^2.0.7
  cached_network_image: ^3.2.3
  intl: ^0.18.1

  # MAPAS - MIGRACIÓN A GOOGLE MAPS
  google_maps_flutter: ^2.10.0        # Actualizado para mejor compatibilidad con Kotlin 2.1+
  geolocator: ^10.1.0                # Para ubicación más precisa
  permission_handler: ^11.4.0        # Mantener para permisos

  # Navegación y URLs
  url_launcher: ^6.2.5               # ← AGREGADO PARA BRIGADISTAS

  # Multimedia
  uuid: ^4.2.1
  image_picker: ^1.0.2
  path_provider: ^2.1.0
  flutter_image_compress: ^2.1.0  # Compresión de imágenes para optimización

  # IA
  http: ^0.13.5
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.2
  flutter_launcher_icons: ^0.13.1

# CONFIGURACIÓN DE ICONOS - ACTUALIZADA
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Icons/ios/iTunesArtwork@3x.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/Icons/android/mipmap-xxxhdpi/LumVida_Icono_foreground.png"
  adaptive_icon_foreground_insets: 16

# Fondos y imagenes
flutter:
  uses-material-design: true

  assets:
    - assets/images/Fondo blanco.png
    - assets/images/Logo blanco.png
    - .env